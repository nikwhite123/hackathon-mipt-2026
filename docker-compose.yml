version: '3.9'
services:
  db:
    image: postgres:16
    container_name: rostelecom-postgres
    environment:
      POSTGRES_DB: rostelecom_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_user -d rostelecom_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
