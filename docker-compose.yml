version: '3.8'

services:

  api:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    networks:
      - rt-network


  web:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - rt-network

networks:
  rt-network:
    driver: bridge