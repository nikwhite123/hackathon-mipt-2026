services:
  db:
    image: postgres:16
    container_name: rostelecom-postgres
    environment:
      POSTGRES_DB: rostelecom_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_user -d rostelecom_db']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rostelecom-api
    environment:
      DATABASE_URL: postgresql+psycopg2://app_user:app_password@db:5432/rostelecom_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-docker-compose}
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      ENABLE_METRICS: 'true'
      WAIT_FOR_DB: 'true'
      RUN_MIGRATIONS_ON_START: 'true'
      RUN_SEED_ON_START: 'true'
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend-vite
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: rostelecom-web
    ports:
      - '8080:80'
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: rostelecom-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    depends_on:
      - api

volumes:
  postgres_data:
