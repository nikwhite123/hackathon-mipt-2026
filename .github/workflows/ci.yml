name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest tests/ -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend-vite/package-lock.json

    - name: Install dependencies
      working-directory: frontend-vite
      run: npm ci

    - name: Run Frontend Tests
      working-directory: frontend-vite
      run: npm run test:run

    - name: Lint and Build
      working-directory: frontend-vite
      run: npm run lint && npm run build
  docker-build:
    needs: [ frontend-build, backend-tests ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Frontend Image
        run: |
          docker build -t rostelecom-web:latest ./frontend-vite

      - name: Build Backend Image
        run: |
          docker build -t rostelecom-api:latest ./backend
